*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:sans-serif}

.chat-btn{width:100%;margin-top:8px;background:#ff2a6d;border:0;color:#fff;padding:8px;border-radius:20px;font-weight:700}
#chat{position:fixed;inset:0;background:#0a0a0a;z-index:99;display:none;flex-direction:column}
</style>
</head>

</div>

  document.querySelectorAll('.tag').forEach(x=>x.classList.remove('active')); d.classList.add('active');

function show(list){

function snd(){
 let inp=document.getElementById('inp'); if(!inp.value.trim())return;

  ms.scrollTop=9999;
 },800);
}
document.getElementById('sr').addEventListener('input',e=>{
 let q=e.target.value.toLowerCase(); show(DATA.filter(x=>x.name.toLowerCase().includes(q)));
});
</script>
</body>
</html>
